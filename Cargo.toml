[package]
name = "algo-sketch"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "algo-sketch"
path = "src/main.rs"

[dependencies]
eframe = "0.27"
egui = "0.27"
egui_plot = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
name = "COME2105-2026-TEAM01"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = "0.27.0"
eframe = { version = "0.27.0", features = ["glow"] } # 맥/윈도우 공통 그래픽 백엔드
serde = { version = "1.0", features = ["derive"] }    # 팀원 C의 데이터 저장을 위한 라이브러리
serde_json = "1.0"
